name: CI
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements.txt
      - run: ./mvnw -B -ntp clean verify
        working-directory: libs/java
      - run: python tools/check_parity.py
      - run: python tools/check_packages.py --jar libs/java/target/orvin-0.2.0-SNAPSHOT.jar
      - name: Check repeat main-JAR build
        if: matrix.java == '17'
        working-directory: libs/java
        run: |
          cp target/orvin-0.2.0-SNAPSHOT.jar /tmp/orvin-first.jar
          ./mvnw -B -ntp clean package -DskipTests
          cmp /tmp/orvin-first.jar target/orvin-0.2.0-SNAPSHOT.jar
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.java == '17'
        with:
          name: orvin-candidate
          path: libs/java/target/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements.txt build
      - run: python tools/dataset.py
      - run: python -m unittest discover -s tools
      - run: python -m unittest discover -s libs/python/tests
        env:
          PYTHONPATH: libs/python
      - run: python -m build libs/python
      - run: python tools/check_packages.py --wheel libs/python/dist/*.whl
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip install --no-deps libs/python/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'from orvin import HsnTsnLookup, VinDecoder; assert HsnTsnLookup.bundled().lookup("0005", "AMQ")["value"]["tradeName"] == "1ER REIHE"; assert VinDecoder.bundled().decode("1HGAAAAAAAAAAAAAA")["status"] == "RECOGNIZED"; golf = VinDecoder.bundled().decode("WVWZZZ1KZ5P000001"); assert golf["model"]["value"] == "Golf"; assert len(golf["details"]["sources"]) == 3'
      - run: git diff --exit-code
