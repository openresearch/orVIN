name: Release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      ref:
        type: string
        required: true
      publish:
        type: boolean
        required: false
        default: false
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dry-run version (vMAJOR.MINOR.PATCH); manual runs never publish'
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare matching release versions
        run: |
          version=$(python tools/release.py prepare "$RELEASE_TAG")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: python -m pip install -r tools/release-requirements.txt
      - name: Build and test release JARs
        run: ./mvnw -B -ntp clean verify
        working-directory: libs/java
      - name: Test and build Python distributions
        run: |
          PYTHONPATH=libs/python python -m unittest discover -s libs/python/tests
          python -m build libs/python
          python -m twine check --strict libs/python/dist/*
      - name: Build and verify the .NET package
        run: |
          dotnet pack libs/dotnet/orVIN -c Release -o libs/dotnet/dist
          dotnet restore libs/dotnet/orVIN.Checks -p:UsePackageVersion="$VERSION" --source "$PWD/libs/dotnet/dist" --source https://api.nuget.org/v3/index.json
          dotnet run --project libs/dotnet/orVIN.Checks -c Release -p:UsePackageVersion="$VERSION" --no-restore -- --bundle-dir "$PWD/data/generated"
      - name: Check embedded data and cross-language behavior
        run: |
          python tools/check_packages.py --jar "libs/java/target/orvin-$VERSION.jar" --wheel "libs/python/dist/orvin-$VERSION-py3-none-any.whl"
          python tools/check_parity.py --jar "libs/java/target/orvin-$VERSION.jar" --dotnet libs/dotnet/orVIN.Checks/bin/Release/net8.0/orVIN.Checks.dll
      - name: Verify installed release wheel outside the checkout
        run: |
          python -m pip install --no-index --no-deps "libs/python/dist/orvin-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          python -c 'from orvin import HsnTsnLookup, VinDecoder; assert VinDecoder.bundled().decode("5YJAAAAAAAAAAAAAA")["brand"]["value"] == "TESLA"; assert HsnTsnLookup.bundled().lookup("0005", "AMQ")["value"]["tradeName"] == "1ER REIHE"; golf = VinDecoder.bundled().decode("WVWZZZ1KZ5P000001"); assert golf["model"]["value"] == "Golf"; assert {"vw-golf-maintenance-2009", "vw-golf-v-profile", "vw-vin-chart-2005"} <= {s["id"] for s in golf["details"]["sources"]}'
      - name: Assemble verified release assets and checksums
        run: python tools/release.py bundle "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orvin-release-${{ env.VERSION }}
          path: target/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish tested Java artifacts to GitHub Packages
        if: github.repository == 'openresearch/orvin' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.publish && github.ref == 'refs/heads/main'))
        working-directory: libs/java
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
            -DrepositoryId=github -Durl=https://maven.pkg.github.com/openresearch/orvin \
            -DpomFile=pom.xml -Dfile="target/orvin-$VERSION.jar" \
            -Dsources="target/orvin-$VERSION-sources.jar" -Djavadoc="target/orvin-$VERSION-javadoc.jar"
      - name: Publish tested NuGet package to GitHub Packages
        if: github.repository == 'openresearch/orvin' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.publish && github.ref == 'refs/heads/main'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "libs/dotnet/dist/OpenResearch.orVIN.$VERSION.nupkg" --source https://nuget.pkg.github.com/openresearch/index.json --api-key "$GITHUB_TOKEN"
      - name: Publish GitHub Release with Java, Python and .NET assets
        if: github.repository == 'openresearch/orvin' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (inputs.publish && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" target/release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "orVIN $VERSION"
